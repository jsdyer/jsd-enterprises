# Substitute the hostname, checkout path and certificate paths.
# Enable SSL and the distribution's PHP handler before enabling this site.

<VirtualHost *:80>
    ServerName investing.example.ca
    Redirect permanent / https://investing.example.ca/
</VirtualHost>

<VirtualHost *:443>
    ServerName investing.example.ca
    DocumentRoot /var/www/jsd-enterprises/public
    DirectoryIndex index.php

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/investing.example.ca/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/investing.example.ca/privkey.pem

    <Directory /var/www/jsd-enterprises/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
